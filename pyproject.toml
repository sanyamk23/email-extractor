[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "email-extractor"
version = "1.0.0"
description = "Rule-based parser that detects job-application emails and extracts candidate metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Data Engineering Team" }]
keywords = ["email", "information-extraction", "job-application", "nlp", "regex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
# Pure standard-library implementation — zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
phone = ["phonenumbers>=8.13"]

[project.scripts]
email-extractor = "email_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["email_extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
