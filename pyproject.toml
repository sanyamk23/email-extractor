[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "email-extractor-engine"
version = "1.0.0"
description = "Generic, zero-cost Email Extraction Engine. Zero LLM calls — uses regex + GLiNER with optional sentence-transformers for dynamic schema discovery."
readme = "email_extractor_engine/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Data Engineering Team" }]
keywords = ["email", "information-extraction", "nlp", "regex", "gliner", "sentence-transformers", "domain-adaptable", "no-llm", "zero-cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
# Pure standard-library implementation — zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
ml = ["gliner>=0.2.0", "torch>=2.0", "sentence-transformers>=2.2.2", "numpy>=1.24"]
html = ["beautifulsoup4>=4.12"]
full = ["gliner>=0.2.0", "torch>=2.0", "sentence-transformers>=2.2.2", "numpy>=1.24", "beautifulsoup4>=4.12", "python-dateutil>=2.8"]

[project.scripts]
email-extractor = "main:main"

[tool.setuptools.packages.find]
where = ["email_extractor_engine"]

[tool.pytest.ini_options]
testpaths = ["email_extractor_engine/tests"]
